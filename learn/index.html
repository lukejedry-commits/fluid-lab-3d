<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiny 2D Water Sim</title>
  <style>
    body { background: #111; color: #ddd; font-family: sans-serif; text-align: center; margin: 8px; }
    canvas { background: #000; border: 1px solid #444; width: 100%; max-width: 640px; touch-action: none; }
    .controls { max-width: 640px; margin: 8px auto; display: grid; gap: 10px; }
    label { display: grid; grid-template-columns: 9em 1fr 4em; align-items: center; gap: 8px; text-align: left; }
    input[type=range] { width: 100%; height: 28px; }   /* big enough for a thumb on a phone */
    button { font-size: 1em; padding: 8px 18px; }
    #status { font-family: monospace; min-height: 1.2em; }
    .warn { color: #ff6060; font-weight: bold; }
  </style>
</head>
<body>
  <h3>Tiny 2D Water Simulation (PIC/FLIP)</h3>
  <canvas id="view" width="640" height="480"></canvas>
  <div id="status"></div>
  <p>Drag to stir, tap to drop water.</p>
  <div class="controls">
    <label>Pressure sweeps <input id="sweeps" type="range" min="1" max="200" step="1" value="200"><span id="sweepsVal"></span></label>
    <label>FLIP ratio <input id="flip" type="range" min="0" max="1" step="0.05" value="0.9"><span id="flipVal"></span></label>
    <div><button id="reset">Reset</button></div>
  </div>
  <script src="fluid2d.js"></script>
  <script>
    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d');
    const scale = canvas.height;              // world is 1 unit tall
    let world = createWorld();
    const params = new URLSearchParams(location.search);

    // Sliders write straight into the world's settings (w.maxSweeps, w.flip). Gravity stays 9.8.
    const sliders = { sweeps: 'maxSweeps', flip: 'flip' };
    function readSliders() {
      for (const [id, key] of Object.entries(sliders)) {
        const value = Number(document.getElementById(id).value);
        world[key] = value;
        document.getElementById(id + 'Val').textContent = value;
      }
    }
    for (const id of Object.keys(sliders)) document.getElementById(id).oninput = readSliders;
    readSliders();
    document.getElementById('reset').onclick = () => { world = createWorld(); readSliders(); };

    // Pointer events work for mouse, touch (iPhone, Chromebook) and pen alike.
    // Convert a pointer position to world units (metres, y pointing up).
    function toWorld(e) {
      const r = canvas.getBoundingClientRect();
      return { x: (e.clientX - r.left) / r.width * (canvas.width / scale),
               y: (1 - (e.clientY - r.top) / r.height), time: performance.now() };
    }
    let down = null, last = null, moved = false;
    canvas.onpointerdown = (e) => { canvas.setPointerCapture(e.pointerId); down = last = toWorld(e); moved = false; };
    canvas.onpointermove = (e) => {
      if (!down) return;
      const now = toWorld(e), dt = Math.max((now.time - last.time) / 1000, 1e-3);
      if (Math.hypot(now.x - down.x, now.y - down.y) > 0.01) moved = true;
      if (moved) world.stir = { x: now.x, y: now.y, vx: (now.x - last.x) / dt, vy: (now.y - last.y) / dt, active: true };
      last = now;
    };
    canvas.onpointerup = canvas.onpointercancel = () => {
      if (down && !moved) addBlob(world, down.x, down.y);   // a tap, not a drag: drop water
      down = null; world.stir.active = false;
    };

    for (let n = Number(params.get('warmup') || 0); n > 0; n--) frame(world);  // warmup = number of 1/240 s frames

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let p = 0; p < world.x.length; p++) {
        const speed = Math.hypot(world.vx[p], world.vy[p]);
        const hue = 220 - Math.min(speed / 3, 1) * 220;  // blue = slow, red = fast
        ctx.fillStyle = `hsl(${hue}, 90%, 55%)`;
        ctx.fillRect(world.x[p] * scale - 2, canvas.height - world.y[p] * scale - 2, 4, 4);
      }
      // Small status line: substeps used, and a warning if pressure ran out of sweeps.
      const cap = world.hitSweepCap ? ' <span class="warn">PRESSURE NOT CONVERGED (sweep cap hit)</span>' : '';
      document.getElementById('status').innerHTML =
        `substeps: ${world.substeps ?? 1} &nbsp; particles: ${world.x.length}${cap}`;
    }
    function animate() {
      let capThisFrame = false;
      for (let s = 0; s < 4; s++) { frame(world); capThisFrame = capThisFrame || world.hitSweepCap; }
      world.hitSweepCap = capThisFrame;
      draw(); requestAnimationFrame(animate);
    }
    if (params.has('still')) draw(); else animate();
  </script>
</body>
</html>
