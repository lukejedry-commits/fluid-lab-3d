<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tiny 2D Water Sim</title>
  <style>
    body { background: #111; color: #ddd; font-family: sans-serif; text-align: center; }
    canvas { background: #000; border: 1px solid #444; }
  </style>
</head>
<body>
  <h3>Tiny 2D Water Simulation (PIC/FLIP dam break)</h3>
  <canvas id="view" width="640" height="480"></canvas>
  <p><button id="reset">Reset</button></p>
  <script src="fluid2d.js"></script>
  <script>
    const canvas = document.getElementById('view');
    const ctx = canvas.getContext('2d');
    const scale = canvas.height;              // world is 1 unit tall
    let world = createWorld();
    document.getElementById('reset').onclick = () => { world = createWorld(); };
    const params = new URLSearchParams(location.search);
    for (let n = Number(params.get('warmup') || 0); n > 0; n--) frame(world);  // warmup = number of 1/240 s frames

    function draw() {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let p = 0; p < world.x.length; p++) {
        const speed = Math.hypot(world.vx[p], world.vy[p]);
        const hue = 220 - Math.min(speed / 3, 1) * 220;  // blue = slow, red = fast
        ctx.fillStyle = `hsl(${hue}, 90%, 55%)`;
        ctx.fillRect(world.x[p] * scale - 2, canvas.height - world.y[p] * scale - 2, 4, 4);
      }
    }
    function animate() { for (let s = 0; s < 4; s++) frame(world); draw(); requestAnimationFrame(animate); }
    if (params.has('still')) draw(); else animate();
  </script>
</body>
</html>
